<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">Como este site é entregue</title>
  <desc id="d">Um push na branch main do GitHub dispara o GitHub Actions, que gera a imagem e a publica no Docker Hub com a tag do commit; em seguida faz o deploy no cluster Kubernetes (OKE) com rolling update. No cluster, o ingress-nginx atende o visitante em HTTPS e encaminha para os pods nginx; o cert-manager emite e renova os certificados Let's Encrypt e o external-dns cria os registros no Cloudflare DNS.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#22d3ee"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a1a1a1"/></marker>
    <style>
      .box{fill:#0a0a0a;stroke:#3d3d3d;stroke-width:1.5}
      .hot{stroke:#22d3ee}
      .h{font:700 20px Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#ededed}
      .s{font:500 15px Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#a1a1a1}
      .lbl{font:700 15px Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#a1a1a1;letter-spacing:.02em}
      .flow{stroke:#22d3ee;stroke-width:2.5;fill:none;marker-end:url(#a)}
      .ctl{stroke:#a1a1a1;stroke-width:1.5;fill:none;stroke-dasharray:6 6;marker-end:url(#g)}
    </style>
  </defs>
  <rect width="1200" height="560" fill="#000"/>

  <!-- Entrega (CI/CD) -->
  <rect class="box" x="30" y="40" width="240" height="100" rx="6"/>
  <text class="h" x="52" y="82">GitHub</text><text class="s" x="52" y="110">push na branch main</text>
  <rect class="box" x="330" y="40" width="240" height="100" rx="6"/>
  <text class="h" x="352" y="82">GitHub Actions</text><text class="s" x="352" y="110">build e push da imagem</text>
  <rect class="box" x="630" y="40" width="240" height="100" rx="6"/>
  <text class="h" x="652" y="82">Docker Hub</text><text class="s" x="652" y="110">imagem com a tag do commit</text>
  <rect class="box" x="930" y="40" width="240" height="100" rx="6"/>
  <text class="h" x="952" y="82">Deploy</text><text class="s" x="952" y="110">rolling update, sem downtime</text>
  <path class="flow" d="M270 90H322"/><path class="flow" d="M570 90H622"/><path class="flow" d="M870 90H922"/>

  <!-- Cluster -->
  <rect x="330" y="200" width="840" height="330" rx="8" fill="none" stroke="#3d3d3d" stroke-width="1.5" stroke-dasharray="2 5"/>
  <text class="lbl" x="352" y="232">CLUSTER KUBERNETES (OKE)</text>
  <rect class="box hot" x="360" y="255" width="260" height="95" rx="6"/>
  <text class="h" x="382" y="295">ingress-nginx</text><text class="s" x="382" y="323">HTTPS e 301 para o domínio</text>
  <rect class="box hot" x="900" y="255" width="240" height="95" rx="6"/>
  <text class="h" x="922" y="295">Pods nginx</text><text class="s" x="922" y="323">réplicas não-root, autoscaling</text>
  <rect class="box" x="360" y="410" width="260" height="95" rx="6"/>
  <text class="h" x="382" y="450">external-dns</text><text class="s" x="382" y="478">registros no Cloudflare</text>
  <rect class="box" x="660" y="410" width="260" height="95" rx="6"/>
  <text class="h" x="682" y="450">cert-manager</text><text class="s" x="682" y="478">Let's Encrypt, renovação auto.</text>
  <path class="flow" d="M620 302H892"/>
  <path class="flow" d="M1050 140V247"/>
  <path class="ctl" d="M790 410V380H490V358"/>

  <!-- Visitante e DNS -->
  <rect class="box" x="30" y="255" width="240" height="95" rx="6"/>
  <text class="h" x="52" y="295">Visitante</text><text class="s" x="52" y="323">dublinconsulting.com.br</text>
  <rect class="box" x="30" y="410" width="240" height="95" rx="6"/>
  <text class="h" x="52" y="450">Cloudflare DNS</text><text class="s" x="52" y="478">resolve o endereço</text>
  <path class="flow" d="M270 302H352"/>
  <path class="ctl" d="M150 350V402"/>
  <path class="ctl" d="M360 457H278"/>
</svg>
