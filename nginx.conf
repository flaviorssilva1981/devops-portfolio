worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 512;

  # Necessário porque o container roda como usuário não-root
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'self'" always;

    # Endpoint de liveness/readiness para probes do Kubernetes/OKE
    location = /healthz {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    error_page 404 /404.html;
    location = /404.html {
      internal;
    }

    location / {
      try_files $uri $uri.html $uri/ =404;
    }

    # CSS/JS mudam a cada deploy: o navegador revalida sempre (ETag, 304 se nada mudou),
    # para nunca combinar HTML novo com CSS/JS antigos em cache
    location ~* \.(css|js)$ {
      # add_header em um location anula os do nível server: repetir os de segurança
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'self'" always;
      add_header Cache-Control "no-cache";
    }

    location ~* \.(svg|png|jpg|jpeg|gif|ico|webp|woff2?|webm|mp4|pdf)$ {
      expires 1d;
      # add_header em um location anula os do nível server: repetir os de segurança
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'self'" always;
      add_header Cache-Control "public";
    }
  }

  # www e o subdomínio antigo redirecionam para o endereço principal (301, mantém caminho e query).
  # Fica depois do server principal, que continua sendo o padrão (probes pelo IP do pod, host principal).
  server {
    listen 8080;
    server_name www.dublinconsulting.com.br devops-portfolio.dublinconsulting.com.br;
    server_tokens off;
    return 301 https://dublinconsulting.com.br$request_uri;
  }
}
