# Mesmo padrão usado nas demais apps do cluster (ex.: aiops.dublinconsulting.com.br):
# ingress-nginx + cert-manager (ClusterIssuer "letsencrypt") + external-dns/Cloudflare.
#
# Hosts: dublinconsulting.com.br é o endereço principal; www continua atendido só para
# redirecionar com 301 para o endereço principal (redirecionamento feito no nginx da aplicação,
# pois o controller tem allow-snippet-annotations=false). O subdomínio antigo
# (devops-portfolio) foi aposentado e não existe mais.
# Um único certificado cobre os dois nomes (secretName devops-portfolio-tls).
#
# Cloudflare: os hosts passam pelo proxy (CDN + WAF da zona). Este arquivo é reaplicado a cada
# deploy, então "cloudflare-proxied" precisa ficar "true": com "false" o external-dns devolve
# os hosts para DNS-only (fora do CDN e do WAF) a cada push na main.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-portfolio
  namespace: devops-portfolio
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    external-dns.alpha.kubernetes.io/hostname: dublinconsulting.com.br,www.dublinconsulting.com.br
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: dublinconsulting.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-portfolio
                port:
                  name: http
    - host: www.dublinconsulting.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-portfolio
                port:
                  name: http
  tls:
    - hosts:
        - dublinconsulting.com.br
        - www.dublinconsulting.com.br
      secretName: devops-portfolio-tls
